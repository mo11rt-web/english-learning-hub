workflows:
  android-workflow:
    name: English Hub - Android Live Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 22.13.0
      java: 17
      groups:
        - firebase_config
        - google_services
      vars:
        NEXT_PUBLIC_CAPACITOR_BUILD: "true"

    scripts:
      - name: Write web/runtime env vars
        script: |
          {
            echo "NEXT_PUBLIC_FIREBASE_API_KEY=$NEXT_PUBLIC_FIREBASE_API_KEY"
            echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN"
            echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$NEXT_PUBLIC_FIREBASE_PROJECT_ID"
            echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET"
            echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID"
            echo "NEXT_PUBLIC_FIREBASE_APP_ID=$NEXT_PUBLIC_FIREBASE_APP_ID"
            echo "NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=$NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME"
            echo "NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=$NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET"
          } >> .env.production.local

      - name: Install dependencies
        script: |
          npm install

      - name: Build Next.js Web App (Static Export)
        script: |
          npm run build

      - name: Add Android platform
        script: |
          npx cap add android || true

      - name: Patch AndroidManifest.xml & Gradle for FCM
        script: |
          node scripts/patch-android-native.js

      - name: Place google-services.json
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          fi

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Build Android APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
