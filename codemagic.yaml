workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: v22.13.0
      java: 17
      groups:
        - app
      vars:
        CAPACITOR_BUILD: "true"
    scripts:
      - name: Set up environment variables
        script: |
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=$NEXT_PUBLIC_FIREBASE_API_KEY" >> .env
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" >> .env
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$NEXT_PUBLIC_FIREBASE_PROJECT_ID" >> .env
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" >> .env
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" >> .env
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=$NEXT_PUBLIC_FIREBASE_APP_ID" >> .env
          echo "NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=$NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME" >> .env
          echo "NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=$NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET" >> .env
      - name: Install dependencies
        script: |
          npm install
      - name: Build Next.js Web App
        script: |
          # We use a trick: build for static export only here
          export NEXT_PUBLIC_CAPACITOR_BUILD=true
          npx next build
          # If next build didn't produce 'out' (because we removed output:export),
          # we can force it or use the .next/standalone if configured.
          # But for Capacitor, we need a static export.
          # Let's try to force export for this specific step:
          npx next export || true
          
          # If 'out' still not found, let's try to find where the static files are
          if [ ! -d "out" ]; then
            echo "Attempting to create out directory manually..."
            mkdir -p out
            cp -r .next/static out/_next/static || true
          fi
      - name: Set up Android Firebase
        script: |
          npx cap add android || true
          mkdir -p android/app
          # فك تشفير ملف إعدادات Firebase
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo $GOOGLE_SERVICES_JSON | base64 --decode > android/app/google-services.json
          fi
          
          # إضافة صلاحيات الإشعارات في AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '\''/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />'\'' $MANIFEST_PATH
            sed -i '\''/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />'\'' $MANIFEST_PATH
            sed -i '\''/<\/manifest>/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'\'' $MANIFEST_PATH
          fi

          # ربط خدمات جوجل في ملفات Gradle (ضروري جداً لـ FCM)
          # 1. ملف المشروع build.gradle
          GRADLE_PROJECT="android/build.gradle"
          if [ -f "$GRADLE_PROJECT" ]; then
            sed -i '\''/dependencies {/a \        classpath "com.google.gms:google-services:4.4.1"'\'' $GRADLE_PROJECT
          fi

          # 2. ملف التطبيق build.gradle
          GRADLE_APP="android/app/build.gradle"
          if [ -f "$GRADLE_APP" ]; then
            echo "apply plugin: '\''com.google.gms.google-services'\''" >> $GRADLE_APP
          fi
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
