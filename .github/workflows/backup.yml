name: نسخة احتياطية يومية

on:
  schedule:
    # كل يوم الساعة ٢ فجرًا بتوقيت UTC (٤ أو ٥ صباحًا تقريبًا بتوقيت الأردن/سوريا حسب التوقيت الصيفي)
    - cron: "0 2 * * *"
  workflow_dispatch: {} # يسمح بتشغيلها يدويًا من تبويب Actions بأي وقت

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: تثبيت الحزم
        run: npm ci

      - name: تشغيل النسخ الاحتياطي
        env:
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
        run: npm run backup

      - name: حفظ النسخة داخل المستودع
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "🗄️ نسخة احتياطية تلقائية $(date +%F)"
          git push
